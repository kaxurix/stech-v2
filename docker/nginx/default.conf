server {
    listen 80;
    listen [::]:80;
    
    # Path root harus mengarah ke folder public aplikasi di volume bersama
    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset build Vite (nama file sudah di-hash per rilis) — aman di-cache selamanya
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Meneruskan file PHP ke container php-fpm (stech-app) pada port 9000
    location ~ \.php$ {
        fastcgi_pass stech-app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
