server {
    listen 80;
    listen [::]:80;
    
    # Path root harus mengarah ke folder public aplikasi di volume bersama
    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # Security headers (flagged by HostedScan 2026-07-22)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://ui-avatars.com; connect-src 'self'; frame-ancestors 'self';" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset build Vite (nama file sudah di-hash per rilis) — aman di-cache selamanya
    # add_header di server{} tidak otomatis diwarisi ke sini karena location ini
    # juga mendefinisikan add_header sendiri (Cache-Control), jadi diulang manual.
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://ui-avatars.com; connect-src 'self'; frame-ancestors 'self';" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Meneruskan file PHP ke container php-fpm (stech-app) pada port 9000
    location ~ \.php$ {
        fastcgi_pass stech-app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
